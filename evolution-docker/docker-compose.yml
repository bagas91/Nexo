version: '3.3'

services:
  evolution_api:
    image: atendai/evolution-api:v2.2.1 # Upgrade para tentar corrigir QR stall
    restart: always
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=zapflow-global-secret-key
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_password@postgres:5432/evolution
      - DATABASE_PROVIDER=postgresql
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - SERVER_URL=http://localhost:8080
      - WEBSOCKET_ENABLED=true
      - WA_BUSINESS_TOKEN_WEBHOOK=webhook_token_here
      - WA_BUSINESS_URL=https://graph.facebook.com
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_password
      - POSTGRES_DB=evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - evolution_redis_data:/data

volumes:
  evolution_postgres_data:
  evolution_redis_data:
